<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBW Live — Galeria de estados</title>
<link rel="icon" href="/assets/logo.svg">
<link rel="stylesheet" href="/ui.css">
<style>
  .toolbar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 8px; }
  .toolbar .group { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    appearance: none; border: 1px solid var(--line); background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 999px; font: 600 13px var(--font); cursor: pointer;
  }
  .chip:hover { color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .chip .n { opacity: .7; margin-left: 4px; font-weight: 500; }
  .grid.scenes { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); }
  @media (max-width: 520px) { .grid.scenes { grid-template-columns: 1fr; } }
  .scene { overflow: hidden; }
  .scene .card-head h3 { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .view { position: relative; overflow: hidden; background: var(--scene); }
  .view iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; color-scheme: normal; }
  /* color-scheme igual ao do overlay: senão o Chrome pinta o fundo do iframe (transparente) de branco */
  .scene-foot { display: flex; align-items: center; gap: 8px; padding: 10px 16px; color: var(--faint); font-size: 12.5px; }
  body[data-bg="mat"] { --scene: radial-gradient(ellipse at 60% 70%, #2b63c9 0%, #1d3f8a 55%, #0f2350 100%); }
  body[data-bg="dark"] { --scene: #0c0f14; }
  body[data-bg="light"] { --scene: #d9dde5; }
  body[data-bg="check"] { --scene: repeating-conic-gradient(#1a2547 0% 25%, #121a35 0% 50%) 50% / 22px 22px; }
</style>
</head>
<body data-bg="mat">
<header id="app-header"></header>

<main class="page">
  <div class="page-head">
    <div>
      <div class="eyebrow">Galeria de estados</div>
      <h1>Todos os gráficos, sem precisar de luta</h1>
      <p>Dados fictícios — ideal para revisar o visual, treinar operadores e testar o OBS/vMix antes do evento.</p>
    </div>
  </div>

  <div class="card toolbar">
    <div class="chips" id="chips" role="toolbar" aria-label="Filtrar por grupo"></div>
    <span class="spacer"></span>
    <label class="group">Fundo
      <select class="input" id="bg" style="width:auto;min-height:34px">
        <option value="mat">Tapete</option><option value="dark">Escuro</option><option value="light">Claro</option><option value="check">Xadrez (transparência)</option>
      </select>
    </label>
    <label class="group">Configurações
      <select class="input" id="cfg" style="width:auto;min-height:34px"><option value="live">As salvas</option><option value="default">Padrão</option></select>
    </label>
  </div>

  <div id="main"></div>
</main>

<script type="module">
import { SCENARIOS } from '/mocks.js';
import { mountHeader, icon, esc } from '/ui.js';
mountHeader('gallery');

// Recorte de cada tipo de cena no quadro 1920×1080 (x, y, largura, altura)
const REGIONS = {
  bug: [30, 20, 700, 300],        // só o placar
  wide: [30, 20, 1150, 300],      // placar + painel lateral (challenge, vitória, tempo)
  intro: [380, 690, 1160, 390],   // tarja inferior
};
const regionFor = (name, sc) => {
  if (name.startsWith('apresentacao')) return REGIONS.intro;
  return ['Challenge', 'Resultado', 'Tempo'].includes(sc.group) ? REGIONS.wide : REGIONS.bug;
};

const main = document.getElementById('main');
const cfgSel = document.getElementById('cfg');
const bgSel = document.getElementById('bg');
const chips = document.getElementById('chips');
try { bgSel.value = localStorage.getItem('preview-bg') || 'mat'; } catch {}
document.body.dataset.bg = bgSel.value;
bgSel.onchange = () => { document.body.dataset.bg = bgSel.value; try { localStorage.setItem('preview-bg', bgSel.value); } catch {} };

const groups = {};
for (const [name, sc] of Object.entries(SCENARIOS)) (groups[sc.group] ||= []).push([name, sc]);
let filter = 'Todos';

function renderChips() {
  const all = Object.keys(SCENARIOS).length;
  chips.innerHTML = [['Todos', all], ...Object.entries(groups).map(([g, items]) => [g, items.length])]
    .map(([g, n]) => `<button class="chip" aria-pressed="${g === filter}" data-g="${esc(g)}">${esc(g)}<span class="n">${n}</span></button>`).join('');
}
chips.addEventListener('click', (e) => {
  const c = e.target.closest('[data-g]'); if (!c) return;
  filter = c.dataset.g; renderChips(); render();
});

// bg=transparent: a galeria mostra o gráfico sobre o "Fundo" escolhido aqui,
// mesmo que o overlay esteja configurado com chroma verde/azul.
const src = (name) => `/overlay.html?mock=${encodeURIComponent(name)}&bg=transparent${cfgSel.value === 'default' ? '&settings=default' : ''}`;

function render() {
  main.replaceChildren();
  for (const [group, items] of Object.entries(groups)) {
    if (filter !== 'Todos' && filter !== group) continue;
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `<h2>${esc(group)}</h2><span>${items.length} cena(s)</span>`;
    const grid = document.createElement('div');
    grid.className = 'grid scenes';
    main.append(title, grid);

    for (const [name, sc] of items) {
      const [x, y, w, h] = regionFor(name, sc);
      const card = document.createElement('article');
      card.className = 'card scene';
      card.innerHTML = `
        <div class="card-head"><h3>${esc(sc.title)}</h3>
          <button class="btn sm ghost" data-replay>${icon('refresh')} Animar</button>
          <a class="btn sm" href="${src(name)}" target="_blank" rel="noopener">${icon('external')} Tela cheia</a>
        </div>
        <div class="view" style="aspect-ratio:${w} / ${h}"><iframe loading="lazy" title="${esc(sc.title)}"></iframe></div>
        <div class="scene-foot">${sc.steps ? `<span class="badge brand">animação em ciclo</span>` : ''}<code>?mock=${esc(name)}</code></div>`;
      const view = card.querySelector('.view');
      const iframe = card.querySelector('iframe');
      iframe.src = src(name);
      const fit = () => { iframe.style.transform = `scale(${view.clientWidth / w}) translate(${-x}px, ${-y}px)`; };
      new ResizeObserver(fit).observe(view);
      card.querySelector('[data-replay]').onclick = () => { iframe.src = src(name); };
      grid.append(card);
    }
  }
}
cfgSel.onchange = render;
renderChips();
render();
</script>
</body>
</html>
