<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CBW Live — Galeria de estados</title>
<style>
  :root { --bg: #0e1117; --panel: #171b24; --line: #2a3040; --text: #e8ebf2; --muted: #8a93a6; --accent: #4fd1c5; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 16px;
           padding: 12px 20px; background: rgba(14,17,23,.95); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header a { color: var(--accent); font-size: 14px; }
  header label { color: var(--muted); font-size: 13px; display: flex; gap: 6px; align-items: center; }
  header select { background: #222838; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  main { padding: 16px 20px 40px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .card header { position: static; padding: 8px 12px; background: none; border-bottom: 1px solid var(--line); justify-content: space-between; gap: 8px; }
  .card header span { font-weight: 600; font-size: 14px; }
  .card header div { display: flex; gap: 6px; }
  .card button, .card a.open { appearance: none; border: 1px solid var(--line); background: #222838; color: var(--text); border-radius: 5px;
           padding: 3px 9px; font: inherit; font-size: 12px; cursor: pointer; text-decoration: none; }
  .view { position: relative; overflow: hidden; background: var(--scene); }
  .view iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .tag { font-size: 11px; color: var(--muted); }
  body[data-bg="mat"] { --scene: radial-gradient(ellipse at 60% 70%, #2b63c9 0%, #1d3f8a 55%, #0f2350 100%); }
  body[data-bg="dark"] { --scene: #111; }
  body[data-bg="light"] { --scene: #d9dde5; }
  body[data-bg="check"] { --scene: repeating-conic-gradient(#20242e 0% 25%, #191c24 0% 50%) 50% / 24px 24px; }
</style>
</head>
<body data-bg="mat">
<header>
  <h1>CBW Live — Galeria de estados</h1>
  <a href="/">← tapetes</a>
  <a href="/settings.html">⚙ configurações</a>
  <label>Fundo
    <select id="bg">
      <option value="mat">tapete</option><option value="dark">escuro</option><option value="light">claro</option><option value="check">xadrez (transparência)</option>
    </select>
  </label>
  <label>Configurações
    <select id="cfg"><option value="live">as salvas</option><option value="default">padrão</option></select>
  </label>
</header>
<main id="main"></main>

<script type="module">
import { SCENARIOS } from '/mocks.js';

// Recorte de cada tipo de cena no quadro 1920×1080 (x, y, largura, altura)
const REGIONS = {
  bug: [30, 20, 700, 300],        // só o placar
  wide: [30, 20, 1150, 300],      // placar + painel lateral (challenge, vitória, tempo)
  intro: [380, 690, 1160, 390],   // tarja inferior
};
const regionFor = (name, sc) => {
  if (name.startsWith('apresentacao')) return REGIONS.intro;
  return ['Challenge', 'Resultado', 'Tempo'].includes(sc.group) ? REGIONS.wide : REGIONS.bug;
};

const main = document.getElementById('main');
const cfgSel = document.getElementById('cfg');
const bgSel = document.getElementById('bg');
try { bgSel.value = localStorage.getItem('preview-bg') || 'mat'; } catch {}
document.body.dataset.bg = bgSel.value;
bgSel.onchange = () => { document.body.dataset.bg = bgSel.value; try { localStorage.setItem('preview-bg', bgSel.value); } catch {} };

function src(name) {
  return `/overlay.html?mock=${encodeURIComponent(name)}${cfgSel.value === 'default' ? '&settings=default' : ''}`;
}

function render() {
  main.replaceChildren();
  const groups = {};
  for (const [name, sc] of Object.entries(SCENARIOS)) (groups[sc.group] ||= []).push([name, sc]);
  for (const [group, items] of Object.entries(groups)) {
    const h = document.createElement('h2'); h.textContent = group; main.append(h);
    const grid = document.createElement('div'); grid.className = 'grid'; main.append(grid);
    for (const [name, sc] of items) {
      const [x, y, w, hgt] = regionFor(name, sc);
      const card = document.createElement('div'); card.className = 'card';
      const head = document.createElement('header');
      const title = document.createElement('span'); title.textContent = sc.title;
      const actions = document.createElement('div');
      const replay = document.createElement('button'); replay.textContent = '↻ animar';
      const open = document.createElement('a'); open.className = 'open'; open.textContent = 'tela cheia'; open.target = '_blank'; open.href = src(name);
      actions.append(replay, open); head.append(title, actions);
      const view = document.createElement('div'); view.className = 'view'; view.style.aspectRatio = `${w} / ${hgt}`;
      const iframe = document.createElement('iframe'); iframe.loading = 'lazy'; iframe.src = src(name); iframe.title = sc.title;
      view.append(iframe);
      const fit = () => { const k = view.clientWidth / w; iframe.style.transform = `scale(${k}) translate(${-x}px, ${-y}px)`; };
      new ResizeObserver(fit).observe(view);
      replay.onclick = () => { iframe.src = src(name); };
      const tag = document.createElement('div'); tag.className = 'tag'; tag.style.padding = '6px 12px'; tag.textContent = sc.steps ? 'animação em ciclo' : `?mock=${name}`;
      card.append(head, view, tag);
      grid.append(card);
    }
  }
}
cfgSel.onchange = render;
render();
</script>
</body>
</html>
